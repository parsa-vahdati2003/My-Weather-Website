<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wether webSite</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="script.js"></script>
  </head>
  <div class="bg-background">
    <div class="relative z-10 max-w-7xl mx-auto px-10 py-9">
    
<div
  class="
    flex flex-col gap-6 mb-8
    md:flex-row md:items-center md:justify-between
    md:mb-10
    lg:gap-6
  "
>

  <div class="flex flex-col gap-1">
    <span
      class="
        text-xs
        sm:text-sm
        text-muted-foreground
        uppercase
        tracking-widest
        font-jetbrains
      "
    >
      WEATHER.SYS
    </span>

    <p
      id="name-country"
      class="
        text-xl
        sm:text-2xl
        font-semibold
        text-white
      "
    >
      Rasht, Gilan Province
    </p>

    <time
      id="date-time"
      datetime="2026-07-10T12:44:00-07:00"
      class="
        text-xs
        sm:text-sm
        text-muted-foreground
        title-case
      "
    >
      Thursday, July 10, 2026 · 12:44 PM PDT
    </time>
  </div>


  <div
    class="
      flex flex-col
      gap-3
      w-full

      sm:flex-row
      sm:items-center

      md:w-auto
      md:flex-1
      md:max-w-lg

      lg:max-w-xl
    "
  >

    <div
      class="
        flex items-center gap-2
        w-full
        min-w-0
        px-3 pr-4 py-3
        rounded-2xl
        border border-border
        bg-bg-Input
        transition-all duration-300
        focus-within:border-border2
         max-w-80
      "
    >
      <label
        for="city-input"
        aria-label="search-box"
        class="sr-only"
      >
        Search
      </label>

      <img
        src="assets/icon/search.svg"
        class="w-4 h-5 shrink-0"
        alt="search"
      />

      <input
        id="city-input"
        placeholder="Search for a city..."
        type="text"
        class="
          flex-1
          min-w-0
          bg-transparent
          outline-none
          text-white
          placeholder:text-white/40
          text-sm
          font-medium
        "
      />
    </div>


   

  </div>
   <div
      class="
        flex items-center gap-1
        self-start
        sm:self-auto
        p-2
        rounded-xl
        bg-bg-Input
        w-max
      " 
    >
      <button
        id="fahrenheit"
        type="button"
        class="
          px-4 py-2
          rounded-lg
          text-sm
          font-bold
          transition-all duration-300
          text-muted-foreground
        "
      >
        F°
      </button>

      <button
        id="celsius"
        type="button"
        class="
          px-4 py-2
          rounded-lg
          text-sm
          font-bold
          transition-all duration-300
          text-muted-foreground
        "
      >
        C°
      </button>
    </div>
</div>


     
      </header>

<section
  id="weather-moment"
  class="grid grid-cols-1 md:grid-cols-[auto_1fr] gap-6 lg:gap-16 rounded-3xl p-5 sm:p-6 md:p-9 mb-6 relative overflow-hidden shadow-2xl transition-all bg-background"
  style="
    background: linear-gradient(
      135deg,
      rgba(0, 212, 255, 0.08) 0%,
      rgba(124, 58, 237, 0.05) 100%
    );
    border: 1px solid rgba(0, 212, 255, 0.15);
    backdrop-filter: blur(16px);
  "
>
  <section class="flex items-center gap-3  md:gap-10 relative z-10 flex-col md:flex-row">
    <img
      id="weather-icon-top"
      src="assets/icon/cloudy.png"
      class=" size-35 md:size-45 drop-shadow-2xl"
    />

    <div>
      <p
        id="tepm-now"
        class="font-bold mb-1 sm:mb-2 tracking-tighter bg-clip-text text-transparent font-mono text-5xl sm:text-6xl md:text-8xl bg-linear-to-b from-white to-indigo-300"
      >
        62°
      </p>

      <p
        id="weather-now"
        class="text-base sm:text-lg md:text-xl font-medium tracking-wide text-primary"
      >
        Partly Cloudy
      </p>
      <p class="mt-1 sm:mt-2 text-sm sm:text-base text-muted-foreground">
        <span id="high-temp">H:67°</span>
        <span class="mx-2 opacity-30">|</span>
        <span id="low-temp">L:52°</span>
      </p>
    </div>
  </section>

  <section
    id="summery-weather"
    class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-2 sm:gap-3 lg:gap-3 relative z-10 content-start"
  >
  </section>
</section>

      <div
        class="flex items-center gap-2 p-2.5 rounded-xl bg-bg-Input max-w-max mb-6"
      >
        <button
          id="hour-show"
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-bold transition-all duration-300 text-muted-foreground"
        >
          Hourly(C°)
        </button>

        <button
          id="five-Day-show"
          type="button"
          class="px-4 py-2 rounded-lg text-sm font-bold transition-all duration-300 text-muted-foreground"
        >
          5-Day(C°)
        </button>
      </div>

      <section
        id="hourly-container"
        class="forecast  active-forecast rounded-3xl p-5.5  transition-all border border-solid border-border bg-background-hourlyAnd7Day backdrop-blur-md"
      >
        <div
          id="hourly-fetch"
          class="grid  grid-cols-3 md:grid-cols-6 lg:grid-cols-9   gap-4  overflow-x-auto p-3 lg:p-1.25"
          style="scrollbar-width: none"
        >
  
        </div>
      </section>

      <section
        id="five-day-container"
        class="forecast hidden rounded-3xl overflow-hidden border border-solid border-border bg-background-hourlyAnd7Day backdrop-blur-md"
      >
        
      </section>
    </div>
  </div>
</div>
